name: Figure skill integration
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-figures.txt
      - run: python scripts/validate_figures.py --check-tracked --smoke --output-dir "$RUNNER_TEMP/figure_validation"
